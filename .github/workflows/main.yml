name: CI

# not for tags: the publish workflow runs the checks itself
on:
  push:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # the oldest supported Node version (engines) and the one pinned in .node-version
        node-version: [22.12.0, 24.19.0]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec puppeteer browsers install chrome

      - run: pnpm run typecheck

      # builds (and lints) in `prebuild`, tests lint again in `pretest`
      - run: pnpm run build

      - run: pnpm run test --forceExit

      - uses: codecov/codecov-action@v7
        if: matrix.node-version == '24.19.0'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          fail_ci_if_error: true
