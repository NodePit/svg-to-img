name: Publish

# ┌─────────────────────────────────────────────────────────────────────────────────────┐
# │ DO NOT RENAME THIS FILE, and do not change the job's `environment:` below.           │
# │                                                                                     │
# │ npm's trusted publisher entry for @nodepit/svg-to-img names "publish.yml" and the   │
# │ "npm" environment literally. Rename either and publishing fails with an auth error  │
# │ that says nothing about the cause.                                                  │
# └─────────────────────────────────────────────────────────────────────────────────────┘

# Version tags only. `pnpm version <bump>` makes the commit and the tag; `git push
# --follow-tags` (the `postversion` script) sends both, and the tag lands here.
on:
  push:
    tags:
      - "v*"

permissions:
  # npm trusts this repo and workflow instead of a token. `id-token: write` lets the runner
  # mint the OIDC token that proves it, and it produces the provenance attestation.
  id-token: write
  # The GitHub release is created at the end of the job.
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      # Trusted publishing needs npm >= 11.5.1, which the pinned Node 24 ships
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # The tag is the release's identity, package.json is what gets published
      - name: Check the tag matches package.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME implies version $TAG_VERSION, but package.json says $PKG_VERSION."
            echo "Bump with 'pnpm version <bump>' rather than tagging by hand."
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_ENV"

      # A pre-release (anything with a hyphen, e.g. 4.0.0-beta.0) goes out under its own
      # dist-tag instead of `latest`
      - name: Choose the dist-tag
        run: |
          case "$version" in
            *-*) TAG="${version#*-}"; TAG="${TAG%%.*}"; PRE=true ;;
            *)   TAG="latest";                          PRE=false ;;
          esac
          echo "npm_tag=$TAG" >> "$GITHUB_ENV"
          echo "prerelease=$PRE" >> "$GITHUB_ENV"
          echo "Publishing $version under dist-tag '$TAG' (prerelease: $PRE)."

      # Before the publish on purpose: a version without a changelog entry should stop the
      # release while re-tagging is still possible
      - name: Take the release notes from the changelog
        run: node scripts/changelog-section.mjs "$version" > "$RUNNER_TEMP/release-notes.md"

      # Already published is not a failure (a retried job), but anything other than a 404 is
      - name: Skip if this version is already on npm
        run: |
          if VIEW_OUT=$(npm view "@nodepit/svg-to-img@${version}" version 2>&1); then
            echo "@nodepit/svg-to-img@${version} is already published, nothing to do."
            echo "already_published=true" >> "$GITHUB_ENV"
          elif echo "$VIEW_OUT" | grep -q "E404"; then
            echo "Not yet published, proceeding."
          else
            echo "npm view failed for a reason other than the version not existing yet:"
            echo "$VIEW_OUT"
            exit 1
          fi

      - run: pnpm exec puppeteer browsers install chrome --install-deps
        if: env.already_published != 'true'
      - run: pnpm run typecheck
        if: env.already_published != 'true'
      - run: pnpm run build
        if: env.already_published != 'true'
      - run: pnpm run test --forceExit
        if: env.already_published != 'true'

      # No token: authentication is the runner's OIDC identity. Provenance is generated by
      # trusted publishing, so no `--provenance` flag.
      - name: Publish to npm
        if: env.already_published != 'true'
        run: npm publish --access public --tag "$npm_tag"

      - name: Create the GitHub release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, leaving it alone."
          else
            if [ "$prerelease" = "true" ]; then FLAGS=--prerelease; else FLAGS=; fi
            # --verify-tag: a mistyped tag must not create a new tag plus a release
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --verify-tag $FLAGS
          fi
        env:
          GH_TOKEN: ${{ github.token }}
