name: CI

# not for tags: the publish workflow runs the checks itself
on:
  push:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          # the version pinned for development: lints, tests, and reports coverage
          - name: pinned
            node-version-file: .node-version
          # the oldest supported version (engines.node): tests only, the lint tooling needs a newer Node
          - name: floor
            node-version: 22.12.0
    name: build (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          node-version-file: ${{ matrix.node-version-file }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec puppeteer browsers install chrome

      - run: pnpm run lint
        if: matrix.name == 'pinned'

      - run: pnpm run build

      - run: pnpm run test

      - uses: codecov/codecov-action@v7
        if: matrix.name == 'pinned'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          fail_ci_if_error: true
